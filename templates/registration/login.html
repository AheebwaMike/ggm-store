{% extends "base.html" %}

{% block title %}Staff Login | GGM Store{% endblock %}

{% block content %}
<section class="bg-white rounded-lg shadow-sm p-6 max-w-sm mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Staff Login</h1>

    {% if form.errors %}
        <p class="mb-4 rounded bg-red-50 p-3 text-sm text-red-700">
            Your username and password didn't match. Please try again.
        </p>
    {% endif %}
    {% for message in messages %}
        <p class="mb-4 rounded bg-red-50 p-3 text-sm text-red-700">{{ message }}</p>
    {% endfor %}

    <form method="post">
        {% csrf_token %}
        <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input id="id_username" name="username" type="text" autocomplete="username" required
               class="mb-4 w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-orange-500 focus:outline-none">

        <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input id="id_password" name="password" type="password" autocomplete="current-password" required
               class="mb-6 w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-orange-500 focus:outline-none">

        <button type="submit"
                class="w-full rounded-lg bg-orange-600 py-3 font-bold text-white hover:bg-orange-700">
            Log in
        </button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>
</section>
{% endblock %}
