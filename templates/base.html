<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GGM Store{% endblock %}</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind with custom config for Inter -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script>
        document.addEventListener('htmx:configRequest', function(evt) {
            const token = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            evt.detail.headers['X-CSRFToken'] = token;
        });
    </script>

    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="vapid-public-key" content="{{ VAPID_PUBLIC_KEY|default:'' }}">
    <meta name="push-subscription-url" content="{% url 'save_push_subscription' %}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#ea580c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="GGM Store">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="icon" href="/static/icons/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

    <!-- Top Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40 hidden md:block">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-orange-600 tracking-tight flex items-center gap-2">
                <i data-lucide="store" class="w-6 h-6"></i>
                GGM Store
            </a>
            <div class="flex items-center gap-6">
                <a href="{% url 'customer_orders' %}" class="text-slate-600 hover:text-orange-600 font-medium text-sm transition">
                    My Orders
                </a>
                <a href="/cart/" class="flex items-center gap-2 text-slate-700 hover:text-orange-600 font-medium transition">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                    Cart
                    <span id="cart-count-desktop"
                          class="text-xs bg-orange-600 text-white rounded-full px-2 py-0.5 min-w-[20px] text-center font-bold"
                          hx-get="{% url 'cart_count' %}"
                          hx-trigger="load, cartUpdated from:body"
                          hx-swap="innerHTML">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-6 pb-24 md:pb-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 pb-safe">
        <div class="flex justify-around items-center h-16">
            <a href="/" class="flex flex-col items-center justify-center w-full h-full text-slate-500 hover:text-orange-600 transition">
                <i data-lucide="home" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-medium">Home</span>
            </a>

            <a href="{% url 'customer_orders' %}" class="flex flex-col items-center justify-center w-full h-full text-slate-500 hover:text-orange-600 transition">
                <i data-lucide="receipt" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-medium">Orders</span>
            </a>

            <a href="/cart/" class="flex flex-col items-center justify-center w-full h-full text-slate-500 hover:text-orange-600 transition relative">
                <div class="relative">
                    <i data-lucide="shopping-bag" class="w-6 h-6 mb-1"></i>
                    <span id="cart-count-mobile"
                          class="absolute -top-1 -right-2 text-[10px] bg-orange-600 text-white rounded-full px-1.5 py-0.5 min-w-[18px] text-center font-bold"
                          hx-get="{% url 'cart_count' %}"
                          hx-trigger="load, cartUpdated from:body"
                          hx-swap="innerHTML">0</span>
                </div>
                <span class="text-[10px] font-medium">Cart</span>
            </a>
        </div>
    </nav>

    <!-- Footer -->
    <footer class="bg-gray-100 text-center text-sm text-gray-500 py-4">
        &copy; {% now "Y" %} GGM Store. Delivering to nearby apartments.
    </footer>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { scope: '/' })
                    .then(async (registration) => {
                        if (
                            'Notification' in window &&
                            Notification.permission === 'granted'
                        ) {
                            await subscribeUserToPush(registration);
                        }
                    })
                    .catch((err) => console.warn('Service worker registration failed:', err));
            });
        }

        window.requestNotificationPermission = async function() {
            if (
                !('serviceWorker' in navigator) ||
                !('PushManager' in window) ||
                !('Notification' in window)
            ) {
                window.alert('Push notifications are not supported in this browser.');
                return;
            }

            try {
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') {
                    if (permission === 'denied') {
                        const banner = document.getElementById('push-prompt-banner');
                        if (banner) banner.style.display = 'none';
                    }
                    return;
                }

                const registration = await navigator.serviceWorker.ready;
                const subscribed = await subscribeUserToPush(registration);
                const banner = document.getElementById('push-prompt-banner');
                if (subscribed && banner) banner.style.display = 'none';
            } catch (error) {
                console.error('Unable to enable push notifications:', error);
            }
        };

        async function subscribeUserToPush(registration) {
            if (!('PushManager' in window)) return;
            const publicKey = document.querySelector(
                'meta[name="vapid-public-key"]'
            )?.content;
            if (!publicKey) return false;

            try {
                let subscription = await registration.pushManager.getSubscription();
                if (!subscription) {
                    subscription = await registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(publicKey),
                    });
                }

                const response = await fetch(
                    document.querySelector(
                        'meta[name="push-subscription-url"]'
                    ).content,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': document.querySelector(
                                'meta[name="csrf-token"]'
                            ).content,
                        },
                        body: JSON.stringify(subscription),
                    }
                );
                if (!response.ok) {
                    throw new Error(`Subscription save failed (${response.status}).`);
                }
                return true;
            } catch (error) {
                console.error('Failed to subscribe the user to push:', error);
                return false;
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding)
                .replace(/-/g, '+')
                .replace(/_/g, '/');
            const rawData = window.atob(base64);
            return Uint8Array.from(rawData, (character) => character.charCodeAt(0));
        }
    </script>
    <script>
        if (window.lucide) {
            window.lucide.createIcons();
        }
    </script>
</body>
</html>
