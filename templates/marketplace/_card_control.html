{# Add button or quantity stepper for one product. On a card it floats over the photo; with inline=True (options sheet) it sits in a row. The card_qty view re-renders it in place. #}
<div class="card-ctl{% if not inline %} absolute bottom-2 right-2 z-10{% endif %}" data-product-id="{{ product.id }}">
    {% if qty %}
    <div class="flex items-center rounded-full bg-white p-0.5 shadow-card ring-1 ring-slate-900/5">
        <button type="button"
                hx-post="{% url 'card_qty' product.id %}" hx-vals='{"action":"dec"}'
                hx-target="closest .card-ctl" hx-swap="outerHTML"
                class="grid h-8 w-8 place-items-center rounded-full transition active:scale-90 active:bg-slate-100 {% if qty == 1 %}text-red-500{% else %}text-slate-600{% endif %}"
                aria-label="{% if qty == 1 %}Remove {{ product.name }} from cart{% else %}Decrease {{ product.name }} quantity{% endif %}">
            <i data-lucide="{% if qty == 1 %}trash-2{% else %}minus{% endif %}" class="h-4 w-4"></i>
        </button>
        <span class="w-6 text-center text-sm font-extrabold tabular-nums text-slate-800" aria-live="polite">{{ qty }}</span>
        <button type="button"
                hx-post="{% url 'card_qty' product.id %}" hx-vals='{"action":"inc"}'
                hx-target="closest .card-ctl" hx-swap="outerHTML"
                class="grid h-8 w-8 place-items-center rounded-full text-brand-600 transition active:scale-90 active:bg-slate-100"
                aria-label="Increase {{ product.name }} quantity">
            <i data-lucide="plus" class="h-4 w-4"></i>
        </button>
    </div>
    {% else %}
    <button type="button"
            hx-post="{% url 'card_qty' product.id %}" hx-vals='{"action":"inc"}'
            hx-target="closest .card-ctl" hx-swap="outerHTML"
            class="grid h-9 w-9 place-items-center rounded-full bg-white text-brand-600 shadow-card ring-1 ring-slate-900/5 transition-transform active:scale-90"
            aria-label="Add {{ product.name }} to cart">
        <i data-lucide="plus" class="h-5 w-5"></i>
    </button>
    {% endif %}
</div>
