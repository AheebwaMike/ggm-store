<div id="product-{{ product.id }}" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 flex items-center justify-between gap-4">
    <div class="min-w-0">
        <div class="flex items-center gap-2 mb-1">
            <p class="font-bold text-slate-800 text-sm truncate">{{ product.name }}</p>
            {% if product.stock_quantity <= product.low_stock_threshold %}
            <span class="bg-red-100 text-red-700 text-[10px] font-bold px-1.5 py-0.5 rounded-md flex items-center gap-1 shrink-0">
                <i data-lucide="alert-triangle" class="w-3 h-3"></i> {{ product.stock_quantity|floatformat:"-2" }} left
            </span>
            {% endif %}
        </div>
        <p class="text-xs text-slate-400 mt-1">Code: {{ product.code }} · UGX {{ product.selling_price|floatformat:0 }}</p>
    </div>

    <form method="post" action="{% url 'staff_toggle_stock' product.id %}"
          hx-post="{% url 'staff_toggle_stock' product.id %}"
          hx-target="#product-{{ product.id }}"
          hx-swap="outerHTML">
        {% csrf_token %}
        <button type="submit"
                class="min-h-11 px-4 py-2 rounded-xl text-xs font-bold transition-all active:scale-95 flex items-center justify-center gap-2 shrink-0
                {% if product.manually_disabled %}bg-red-50 text-red-600 border border-red-100 hover:bg-red-100{% else %}bg-green-50 text-green-700 border border-green-100 hover:bg-green-100{% endif %}">
            {% if product.manually_disabled %}
                <i data-lucide="eye-off" class="w-4 h-4"></i> Out of Stock
            {% else %}
                <i data-lucide="eye" class="w-4 h-4"></i> In Stock
            {% endif %}
        </button>
    </form>
</div>
