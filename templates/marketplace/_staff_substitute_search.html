{% for product in results %}
<button hx-post="{% url 'staff_add_substitute' order.id product.id %}"
        hx-target="#staff-order-items-container"
        hx-swap="outerHTML"
        class="w-full text-left px-3 py-2 text-sm bg-white hover:bg-orange-50 border border-slate-200 rounded-lg flex justify-between items-center transition-colors">
    <span>{{ product.name }} {% if product.variant_label %}({{ product.variant_label }}){% endif %}</span>
    <span class="font-bold text-orange-600">UGX {{ product.selling_price|floatformat:0 }}</span>
</button>
{% empty %}
{% if q %}
<p class="text-xs text-slate-500 text-center py-2">No products found.</p>
{% endif %}
{% endfor %}
