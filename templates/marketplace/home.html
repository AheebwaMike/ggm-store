{% extends "base.html" %}

{% block title %}Home - GGM Store{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">Shop by Category</h1>

<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    {% for group in groups %}
        <a href="{% url 'product_list' group.id %}" 
           class="bg-white rounded-lg shadow-sm hover:shadow-md transition p-4 flex flex-col items-center justify-center text-center h-28">
            <span class="font-semibold text-gray-800 text-sm">{{ group.name }}</span>
        </a>
    {% empty %}
        <p class="col-span-full text-gray-500">No categories found. Please run the import command.</p>
    {% endfor %}
</div>
{% endblock %}
